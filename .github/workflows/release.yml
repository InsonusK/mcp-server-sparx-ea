name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Pure Go (CGO_ENABLED=0) — every target cross-compiles from one Linux runner.

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oE 'Version = "[^"]+"' internal/mcpserver/server.go | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "could not read mcpserver.Version" >&2; exit 1; fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — will build and release"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            bin=mcp-server-sparx-ea; [ "$goos" = windows ] && bin=$bin.exe
            name="mcp-server-sparx-ea_v${VERSION}_${goos}_${goarch}"
            echo "building $name"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w" -o "$bin" .
            if [ "$goos" = windows ]; then
              zip -q "dist/$name.zip" "$bin"
            else
              tar -czf "dist/$name.tar.gz" "$bin"
            fi
            rm -f "$bin"
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.guard.outputs.version }}"
          gh release create "$v" dist/* --title "$v" --generate-notes
